<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="原神（げんしん）の推しキャラを元素別に自由に並べてランキング・Tier表を作れるサイトです。画像を保存して自分の推しをみんなに共有しよう！推しの共有の他にも色々な使い方もできます！原神推しキャラランキング | Genshin Oshi Character Ranking | うーこの部屋では「推しキャラランキング」の他にも色々な機能があるから試してみてね！">

    <title>【原神】うーこの推しキャラランキング - うーこの部屋|Genshin Oshi Character Ranking</title>

    <!-- Favicon -->
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/00_common/favicon_io/favicon.ico" type="image/x-icon">

    <link rel="icon" sizes="192x192" href="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/00_common/favicon_io/android-chrome-192x192.png">

<body>
    <header>
      <div class="header-topbar">
        <div class="lang-switch">
          <label>
            <input type="radio" name="lang" value="ja" checked>
            JP
          </label>
          <label>
            <input type="radio" name="lang" value="en">
            EN
          </label>
        </div>
      </div>

      <h1 data-i18n="title">原神推しキャラランキング</h1>

      <button id="save-button" data-i18n="save">Save Image</button>

      <div>
        <div class="rank-mode-tab-bar" id="rank-mode-tab-bar">
          <button type="button" class="rank-mode-tab-btn active" data-mode="element" data-i18n="modeElement">元素別</button>
          <button type="button" class="rank-mode-tab-btn" data-mode="nation" data-i18n="modeNation">国別</button>
        </div>

        <label>
          <input type="checkbox" id="modeC">
          <span data-i18n="bakatare">ばかたれモード</span>
        </label>
        <br>

        <div class="note" data-i18n="mobileHint">
          ※スマホの人は横画面推奨
        </div>

        <div class="uko-saved-image-wrap" id="uko-saved-image-wrap">
          <button type="button" class="uko-saved-image-toggle" id="uko-saved-image-toggle"><span data-i18n="savedImageToggle">前回保存した画像を確認</span> <span class="uko-saved-image-arrow" id="uko-saved-image-arrow">▼</span></button>
          <div class="uko-saved-image-panel" id="uko-saved-image-panel" style="display:none;">
            <p class="uko-saved-image-message" id="uko-saved-image-message"></p>
            <p class="uko-saved-image-date" id="uko-saved-image-date"></p>
            <img class="uko-saved-image-img" id="uko-saved-image-img" src="" alt="">
          </div>
        </div>
      </div>
    </header>

    <div class="uko-saved-image-modal" id="uko-saved-image-modal" style="display:none;">
      <div class="uko-saved-image-modal-backdrop"></div>
      <div class="uko-saved-image-modal-content">
        <button type="button" class="uko-saved-image-modal-close" id="uko-saved-image-modal-close">×</button>
        <img id="uko-saved-image-modal-img" src="" alt="">
      </div>
    </div>

    <div class="container" id="grid">
        <!-- 列見出し・セルは script.js が現在のモード(元素別/国別)に合わせて作成します -->
        <Label class="sad_label_migi">Twitter:@uko_dayo_</Label>
    </div>

    <div class="tab-wrap" id="tab-wrap">
        <!-- タブ・一覧も script.js が現在のモードに合わせて作成します -->
    </div>

    <a href="https://x.com/uko_dayo_" target="_blank">
        <img src="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/00_common/footer_icon/twitter_image.png" alt="Twitter" class="twitter-icon">
    </a>
    <a href="https://t.co/0jAcAV2GJv" target="_blank" rel="noopener">
        <img src="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/00_common/footer_icon/discord_image.png" alt="Discord" class="twitter-icon">
    </a>
    <Label class="sad_label">  ＜友達ください…</Label>
